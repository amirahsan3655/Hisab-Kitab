<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saudi Ledger Pro</title>
    <style>
        :root {
            --primary: #1b5e20;
            --primary-light: #e8f5e9;
            --income: #2e7d32;
            --expense: #c62828;
            --dark: #263238;
            --bg: #cfd8dc;
            --card-bg: #ffffff;
            --border: #b0bec5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--dark); padding: 20px; direction: ltr; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
        .rtl { direction: rtl; text-align: right; }
        .container { width: 100%; max-width: 750px; background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); border: 1px solid var(--border); }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid var(--primary-light); padding-bottom: 15px; }
        header h2 { font-size: 24px; color: var(--primary); font-weight: 700; }
        select.lang-picker { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; font-weight: 600; cursor: pointer; background: white; }
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .card { padding: 20px; border-radius: 12px; text-align: center; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card.balance { background: linear-gradient(135deg, #37474f, #212121); }
        .card.income { background: linear-gradient(135deg, var(--income), #43a047); }
        .card.expense { background: linear-gradient(135deg, var(--expense), #e53935); }
        .card-lbl { font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.9; margin-bottom: 5px; }
        .card-val { font-size: 20px; font-weight: 700; }
        
        form { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 12px; margin-bottom: 30px; background: var(--primary-light); padding: 20px; border-radius: 12px; border: 1px solid var(--border); align-items: center; }
        input, select.type-select { padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; background: white; width: 100%; outline: none; }
        input:focus, select.type-select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(27,94,32,0.2); }
        button.btn-submit { background-color: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        button.btn-submit:hover { background-color: #0f3d11; transform: translateY(-1px); }
        
        .table-container { width: 100%; overflow-x: auto; background: white; border-radius: 12px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        .rtl table { text-align: right; }
        th { background-color: #eceff1; color: var(--dark); padding: 14px; font-weight: 600; border-bottom: 2px solid var(--border); }
        td { padding: 14px; border-bottom: 1px solid #e0e0e0; vertical-align: middle; }
        tr:hover { background-color: #f8f9fa; }
        
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; display: inline-block; }
        .badge.inc { background-color: #e8f5e9; color: var(--income); }
        .badge.exp { background-color: #ffebee; color: var(--expense); }
        .txt-date { font-size: 11px; color: #78909c; display: block; margin-top: 2px; }
        .delete-btn { background: none; color: #b0bec5; border: none; font-size: 18px; cursor: pointer; transition: color 0.2s; }
        .delete-btn:hover { color: var(--expense); }

        @media(max-width: 768px) {
            form { grid-template-columns: 1fr; }
            .dashboard { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container" id="appContainer">
    <header>
        <h2 id="appTitle">Saudi Ledger Pro</h2>
        <select id="langSelect" class="lang-picker" onchange="changeLanguage(this.value)">
            <option value="en">English</option>
            <option value="ur">اردو (Urdu)</option>
            <option value="ar">العربية (Arabic)</option>
        </select>
    </header>

    <div class="dashboard">
        <div class="card balance">
            <div id="lblNetBalance" class="card-lbl">Net Balance</div>
            <div id="valBalance" class="card-val">0.00 SAR</div>
        </div>
        <div class="card income">
            <div id="lblTotalIncome" class="card-lbl">Total Income</div>
            <div id="valIncome" class="card-val">0.00 SAR</div>
        </div>
        <div class="card expense">
            <div id="lblTotalExpense" class="card-lbl">Total Expense</div>
            <div id="valExpense" class="card-val">0.00 SAR</div>
        </div>
    </div>

    <form id="txForm" onsubmit="addTransaction(event)">
        <input type="text" id="txDesc" placeholder="Description (e.g., Room Rent)" required>
        <input type="number" id="txAmount" placeholder="Amount (SAR)" step="0.01" required>
        <select id="txType" class="type-select">
            <option value="income" id="optIncome">Income (+)</option>
            <option value="expense" id="optExpense">Expense (-)</option>
        </select>
        <button type="submit" id="btnSubmit" class="btn-submit">Save Entry</button>
    </form>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th id="thDetails">Details & Date</th>
                    <th id="thType">Type</th>
                    <th id="thAmount">Amount</th>
                    <th style="width: 50px;"></th>
                </tr>
            </thead>
            <tbody id="txTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // System Translations
    const translations = {
        en: {
            title: "Saudi Ledger Pro",
            balance: "Net Balance",
            income: "Total Income",
            expense: "Total Expense",
            descPlaceholder: "Description (e.g., Al-Baik, Fuel)",
            amountPlaceholder: "Amount (SAR)",
            optIncome: "Income (+)",
            optExpense: "Expense (-)",
            submit: "Add Entry",
            thDetails: "Details & Time",
            thType: "Type",
            thAmount: "Amount",
            tagIncome: "INCOME",
            tagExpense: "EXPENSE",
            rtl: false
        },
        ur: {
            title: "سعودی لیجر پرو",
            balance: "کل بچت / میزان",
            income: "کل آمدنی",
            expense: "کل خرچہ",
            descPlaceholder: "تفصیل (مثلاً: کفیل فیس, بقالہ)",
            amountPlaceholder: "رقم (ریال)",
            optIncome: "آمدنی (+)",
            optExpense: "خرچہ (-)",
            submit: "اندراج کریں",
            thDetails: "تفصیل اور وقت",
            thType: "قسم",
            thAmount: "رقم",
            tagIncome: "آمدنی",
            tagExpense: "خرچہ",
            rtl: true
        },
        ar: {
            title: "دفتر الحسابات المحترف",
            balance: "الرصيد الصافي",
            income: "إجمالي الدخل",
            expense: "إجمالي المصروفات",
            descPlaceholder: "الوصف (مثلاً: سكن, بنزين)",
            amountPlaceholder: "المبلغ (ريال)",
            optIncome: "دخل (+)",
            optExpense: "مصروف (-)",
            submit: "إضافة عملية",
            thDetails: "التفاصيل والوقت",
            thType: "النوع",
            thAmount: "المبلغ",
            tagIncome: "دخل",
            tagExpense: "مصروف",
            rtl: true
        }
    };

    let transactions = JSON.parse(localStorage.getItem('saudi_ledger_pro')) || [];
    let currentLang = 'en';

    function changeLanguage(lang) {
        currentLang = lang;
        const dict = translations[lang];
        
        document.getElementById('appTitle').innerText = dict.title;
        document.getElementById('lblNetBalance').innerText = dict.balance;
        document.getElementById('lblTotalIncome').innerText = dict.income;
        document.getElementById('lblTotalExpense').innerText = dict.expense;
        document.getElementById('txDesc').placeholder = dict.descPlaceholder;
        document.getElementById('txAmount').placeholder = dict.amountPlaceholder;
        document.getElementById('optIncome').innerText = dict.optIncome;
        document.getElementById('optExpense').innerText = dict.optExpense;
        document.getElementById('btnSubmit').innerText = dict.submit;
        document.getElementById('thDetails').innerText = dict.thDetails;
        document.getElementById('thType').innerText = dict.thType;
        document.getElementById('thAmount').innerText = dict.thAmount;

        const container = document.getElementById('appContainer');
        if(dict.rtl) {
            document.body.classList.add('rtl');
        } else {
            document.body.classList.remove('rtl');
        }
        render();
    }

    function addTransaction(e) {
        e.preventDefault();
        const desc = document.getElementById('txDesc').value;
        const amount = parseFloat(document.getElementById('txAmount').value);
        const type = document.getElementById('txType').value;
        
        // Automatic Date & Time Generation
        const now = new Date();
        const dateTimeStr = now.toLocaleDateString('en-GB') + ' | ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

        const transaction = {
            id: Date.now(),
            desc,
            amount,
            type,
            dateTime: dateTimeStr
        };
